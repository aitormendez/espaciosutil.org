name: 🚀 Deploy to Staging

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: 💾 Checkout repo
        uses: actions/checkout@v4

      - name: 🔑 Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.TRELLIS_DEPLOY_SSH_PRIVATE_KEY }}

      - name: Verify staging SSH host identity
        env:
          TRELLIS_DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.TRELLIS_DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$TRELLIS_DEPLOY_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$TRELLIS_DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F 138.68.135.185 -f ~/.ssh/known_hosts >/dev/null

      - name: Prepare Python for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🚧 Setup Trellis CLI
        uses: roots/setup-trellis-cli@v1
        with:
          version: v1.19.0
          cache-virtualenv: false
          ansible-vault-password: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Trellis dependencies
        working-directory: trellis
        run: |
          trellis exec ansible-playbook --version
          trellis exec python -m pip check

      - name: 🚀 Deploy to staging
        run: trellis deploy staging espaciosutil.org
